# Apply only to the existing backend QA and production deployment services.
# The root-owned release preserves the preceding runtime, with the reviewed
# agent_deployment.py and agent_worker_service.py replacements only.
[Service]
WorkingDirectory=/opt/remihub-agent/runtime/releases/deployment-recovery-v1
Environment=PYTHONPATH=/opt/remihub-agent/runtime/releases/deployment-recovery-v1
